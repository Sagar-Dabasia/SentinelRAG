name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # actions/checkout@v4.1.7
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      # astral-sh/setup-uv@v3.2.4
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.0"

      # actions/setup-python@v5.1.1
      - name: Set up Python
        uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Formatting check (Ruff)
        run: uv run ruff format --check .

      - name: Linting (Ruff)
        run: uv run ruff check .

      - name: Type checking (mypy)
        run: uv run mypy src tests

      - name: Unit Tests and Coverage
        run: uv run pytest -q --cov=sentinelrag --cov-report=xml --cov-fail-under=80

      - name: Dependency Audit
        run: uv run pip-audit

      - name: Pre-commit checks (including detect-secrets)
        run: uv run pre-commit run --all-files

      - name: Check diff whitespace
        run: git diff --check

      - name: Confirm hooks made no tracked-file changes
        run: git diff --exit-code

  phase1b-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.0"

      - name: Set up Python
        uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --locked --group phase1b-compat

      - name: Ruff format check for verifier
        run: uv run ruff format --check scripts/verify_phase1b_compatibility.py tests/unit/test_phase1b_compatibility_verifier.py

      - name: Ruff lint for verifier
        run: uv run ruff check scripts/verify_phase1b_compatibility.py tests/unit/test_phase1b_compatibility_verifier.py

      - name: mypy for verifier
        run: uv run mypy scripts tests

      - name: Focused verifier tests
        run: uv run pytest -q tests/unit/test_phase1b_compatibility_verifier.py

      - name: The compatibility verifier
        run: uv run --group phase1b-compat python scripts/verify_phase1b_compatibility.py
