name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # actions/checkout@v4.1.7
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      # Install uv (astral-sh/setup-uv@v2)
      - name: Install uv
        uses: astral-sh/setup-uv@164e29ebdf25cde185a034f71168971f1a5bbcb3
        with:
          version: "latest"

      # actions/setup-python@v5.1.1
      - name: Set up Python
        uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Formatting check (Ruff)
        run: uv run ruff format --check .

      - name: Linting (Ruff)
        run: uv run ruff check .

      - name: Type checking (mypy)
        run: uv run mypy src tests

      - name: Unit Tests and Coverage
        run: uv run pytest -q --cov=sentinelrag --cov-report=xml --cov-fail-under=80

      - name: Dependency Audit
        run: uv run pip-audit

      - name: Secret Scan (detect-secrets)
        run: uv run detect-secrets scan

      - name: Check for uncommitted changes
        run: git diff --check
