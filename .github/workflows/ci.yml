name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # actions/checkout@v4.1.7
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      # astral-sh/setup-uv@v3.2.4
      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39
        with:
          version: "0.12.0"

      # actions/setup-python@v5.1.1
      - name: Set up Python
        uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Formatting check (Ruff)
        run: uv run ruff format --check .

      - name: Linting (Ruff)
        run: uv run ruff check .

      - name: Type checking (mypy)
        run: uv run mypy src tests

      - name: Unit Tests and Coverage
        run: uv run pytest -q --cov=sentinelrag --cov-report=xml --cov-fail-under=80

      - name: Dependency Audit
        run: uv run pip-audit

      - name: Pre-commit checks (including detect-secrets)
        run: uv run pre-commit run --all-files

      - name: Check diff whitespace
        run: git diff --check

      - name: Confirm hooks made no tracked-file changes
        run: git diff --exit-code

  phase1b-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39
        with:
          version: "0.12.0"

      - name: Set up Python
        uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Ruff format check for verifier and contracts
        run: uv run ruff format --check src/sentinelrag/config src/sentinelrag/models scripts/verify_phase1b_compatibility.py tests/unit/config tests/unit/models tests/unit/test_phase1b_compatibility_verifier.py tests/unit/test_phase1a_governance_contract.py tests/unit/test_phase1b_governance_contract.py

      - name: Ruff lint for verifier and contracts
        run: uv run ruff check src/sentinelrag/config src/sentinelrag/models scripts/verify_phase1b_compatibility.py tests/unit/config tests/unit/models tests/unit/test_phase1b_compatibility_verifier.py tests/unit/test_phase1a_governance_contract.py tests/unit/test_phase1b_governance_contract.py

      - name: mypy for verifier and contracts
        run: uv run mypy src tests scripts

      - name: Focused verifier and contract tests
        run: uv run pytest -q tests/unit/config tests/unit/models tests/unit/test_phase1b_compatibility_verifier.py tests/unit/test_phase1a_governance_contract.py tests/unit/test_phase1b_governance_contract.py

      - name: Focused coverage gate
        run: uv run pytest -q tests/unit/config tests/unit/models --cov=sentinelrag.config --cov=sentinelrag.models --cov-branch --cov-report=term-missing --cov-fail-under=95

      - name: The compatibility verifier
        run: uv run python scripts/verify_phase1b_compatibility.py
