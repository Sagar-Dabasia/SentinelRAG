[project]
name = "sentinelrag"
version = "0.1.0"
description = "Phase 0 foundation for SentinelRAG"
authors = [{name = "Maintainer"}]
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
phase1-compat = [
    "fastapi==0.111.0",
    "pydantic==2.8.0",
    "pydantic-settings==2.3.0",
    "uvicorn==0.30.0",
    "httpx==0.27.0",
    "python-multipart==0.0.9",
    "psycopg[binary]==3.3.4",
    "sqlalchemy==2.0.30",
    "alembic==1.13.0",
    "pgvector==0.5.0",
    "streamlit==1.36.0",
    "pypdf==4.2.0",
    "sentence-transformers==3.0.0",
    "torch==2.9.1",
    "transformers==4.44.0"
]

[dependency-groups]
dev = [
    "ruff==0.16.1",
    "mypy>=1.11.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pre-commit>=3.8.0",
    "pip-audit>=2.7.0",
    "detect-secrets>=1.5.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
required-version = "==0.16.1"
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = []

[tool.mypy]
strict = true
python_version = "3.14"
warn_unused_configs = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["sentinelrag"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
