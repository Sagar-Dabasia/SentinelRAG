[project]
name = "sentinelrag"
version = "0.1.0"
description = "Phase 0 foundation for SentinelRAG"
authors = [{name = "Maintainer"}]
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = {text = "Apache-2.0"}
dependencies = [
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "ruff==0.16.3",
    "mypy>=1.11.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pre-commit>=3.8.0",
    "pip-audit>=2.7.0",
    "detect-secrets>=1.5.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
required-version = "==0.16.1"
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = []

[tool.mypy]
strict = true
python_version = "3.14"
warn_unused_configs = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["sentinelrag"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
